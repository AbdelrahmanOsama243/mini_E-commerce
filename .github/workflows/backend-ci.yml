name: Backend CI/CD (Koyeb)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Backend/**'

jobs:
  validate:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./Backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Node.js Syntax
        run: node --check server.js

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=critical

  deploy:
    name: Deploy to Koyeb
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    env:
      KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}

    steps:
      - name: Install Koyeb CLI
        if: ${{ env.KOYEB_TOKEN != '' }}
        run: curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh

      - name: Trigger Redeploy
        if: ${{ env.KOYEB_TOKEN != '' }}
        run: koyeb service redeploy ${{ secrets.KOYEB_SERVICE_NAME }} --token=$KOYEB_TOKEN
