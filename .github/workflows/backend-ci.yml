name: Backend CI/CD (Glitch)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Backend/**'

jobs:
  validate-and-test:
    name: Backend Validation & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./Backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Node.js Syntax & Compilation
        run: |
          node --check server.js
          node --check Controllers/Auth.Controller.js
          node --check Controllers/payment.controller.js
          node --check Controllers/product.controller.js
          node --check Controllers/order.controller.js
          node --check Middlewares/redisCache.js

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=critical || true

  deploy:
    name: Deploy to Glitch
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Backend to Glitch Remote
        if: env.GLITCH_GIT_URL != ''
        env:
          GLITCH_GIT_URL: ${{ secrets.GLITCH_GIT_URL }}
        run: |
          git subtree push --prefix Backend $GLITCH_GIT_URL main || echo "Glitch deploy triggered"
