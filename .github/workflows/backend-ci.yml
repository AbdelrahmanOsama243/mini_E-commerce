name: Backend CI/CD (Cloudflare Workers)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Backend/**'

jobs:
  validate-and-test:
    name: Backend Validation & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./Backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Node.js Syntax & Compilation
        run: |
          node --check server.js
          node --check Controllers/Auth.Controller.js
          node --check Controllers/payment.controller.js
          node --check Controllers/product.controller.js
          node --check Controllers/order.controller.js
          node --check Middlewares/redisCache.js

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=critical || true

  deploy:
    name: Deploy to Cloudflare Workers
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Workers via Wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'Backend'
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
