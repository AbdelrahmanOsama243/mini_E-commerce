name: Frontend CI/CD (Netlify)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Frontend/**'

jobs:
  build-and-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Frontend/mini-E-commerce

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./Frontend/mini-E-commerce/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Production Bundle
        run: npm run build -- --configuration production

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/mini-E-commerce/dist/mini-e-commerce/browser

  deploy:
    name: Deploy to Netlify
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist-browser

      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy --prod --dir=./dist-browser --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
