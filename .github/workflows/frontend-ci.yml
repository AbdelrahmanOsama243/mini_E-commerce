name: Frontend CI/CD (Vercel)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Frontend/**'
      - 'vercel.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Frontend/**'
      - 'vercel.json'

jobs:
  build-and-validate:
    name: Frontend Build & Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Frontend/mini-E-commerce

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./Frontend/mini-E-commerce/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Production Bundle
        run: npm run build -- --configuration production

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/mini-E-commerce/dist/mini-E-commerce/browser

  deploy:
    name: Deploy to Vercel
    needs: build-and-validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Project Settings
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
