name: Mobile CI/CD (EAS Build APK)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Mobile/**'

jobs:
  typecheck-and-lint:
    name: Mobile Type-Check & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Mobile/mini-E-mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./Mobile/mini-E-mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

  eas-build:
    name: EAS Build Production APK
    needs: typecheck-and-lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Mobile/mini-E-mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Build Android Production APK with EAS
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile production --non-interactive --no-wait
