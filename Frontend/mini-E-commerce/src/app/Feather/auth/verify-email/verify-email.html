<div class="min-h-[70vh] flex flex-col items-center justify-center px-6 py-16">
  <div class="w-full max-w-md bg-surface-container brutalist-border p-8 md:p-12 text-center brutalist-shadow">
    
    <!-- Loading State -->
    @if (isLoading) {
      <div class="flex flex-col items-center justify-center gap-4 py-6">
        <span class="material-symbols-outlined text-6xl animate-spin text-primary">autorenew</span>
        <h2 class="text-3xl font-headline font-black uppercase tracking-tight text-primary">Processing...</h2>
        <p class="text-on-surface-variant font-body text-sm">{{ message }}</p>
      </div>
    } @else {
      <!-- Result State -->
      @if (isSuccess) {
        <!-- Success -->
        <div class="flex flex-col items-center justify-center py-4">
          <div class="w-16 h-16 bg-primary-container brutalist-border flex items-center justify-center mb-6">
            <span class="material-symbols-outlined text-4xl text-primary font-bold">check_circle</span>
          </div>
          <h2 class="text-3xl font-headline font-black uppercase tracking-tight mb-2">Verified!</h2>
          <p class="text-on-surface-variant font-body text-sm mb-8">{{ message }}</p>
          <button 
            (click)="goToLogin()" 
            class="w-full py-4 bg-primary text-on-primary text-xl brutalist-button brutalist-shadow brutalist-shadow-hover"
          >
            Sign In Now
          </button>
        </div>
      } @else {
        <!-- Error -->
        <div class="flex flex-col items-center justify-center py-4">
          <div class="w-16 h-16 bg-secondary/10 border-4 border-secondary flex items-center justify-center mb-6">
            <span class="material-symbols-outlined text-4xl text-secondary font-bold">error</span>
          </div>
          <h2 class="text-3xl font-headline font-black uppercase tracking-tight text-secondary mb-2">Verification Failed</h2>
          <p class="text-on-surface-variant font-body text-sm mb-8">{{ message }}</p>
          <a 
            routerLink="/register" 
            class="w-full py-4 bg-primary text-on-primary text-xl brutalist-button brutalist-shadow brutalist-shadow-hover inline-block"
          >
            Register Again
          </a>
        </div>
      }
    }
  </div>
</div>
