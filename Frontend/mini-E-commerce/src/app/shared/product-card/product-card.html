<article class="bg-surface brutalist-border group flex flex-col relative h-full">
  <!-- Stock status badges -->
  @if (product.stock > 0 && product.stock <= 10) {
    <div class="absolute top-4 left-4 z-10 bg-secondary text-on-primary font-headline font-black uppercase px-3 py-1 border-4 border-black transform -rotate-2">
      Low Stock
    </div>
  } @else if (product.stock === 0) {
    <div class="absolute top-4 left-4 z-10 bg-primary text-on-primary font-headline font-black uppercase px-3 py-1 border-4 border-black transform rotate-1">
      Sold Out
    </div>
  }
  
  <!-- Product Image -->
  <a [routerLink]="['/products', product._id]" class="aspect-square border-b-4 border-black overflow-hidden bg-surface-container relative block">
    <img 
      [src]="product.image || 'https://picsum.photos/seed/product/600/600'" 
      [alt]="product.name" 
      class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-300"
    />
  </a>

  <!-- Product Details -->
  <div class="p-4 flex flex-col flex-1 justify-between bg-surface-bright">
    <div>
      <p class="text-xs font-headline font-bold uppercase text-on-surface-variant mb-1">
        {{ product.category }}
      </p>
      <a [routerLink]="['/products', product._id]" class="text-xl font-headline font-black uppercase leading-tight mb-2 hover:text-secondary transition-colors block">
        {{ product.name }}
      </a>
    </div>
    <div class="flex justify-between items-center mt-4 border-t-4 border-black pt-4">
      <span class="text-2xl font-headline font-black">\${{ product.price }}</span>
      
      <button 
        (click)="addToCart($event)" 
        [disabled]="product.stock === 0"
        [title]="product.stock === 0 ? 'Out of Stock' : 'Add to Cart'"
        aria-label="Add to cart" 
        class="w-12 h-12 bg-primary text-on-primary flex items-center justify-center brutalist-button brutalist-shadow-sm brutalist-shadow-sm-hover disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span class="material-symbols-outlined text-2xl font-bold">add</span>
      </button>
    </div>
  </div>
</article>
